apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: brightdotdev/vta-api-gateway:v1
          ports:
            - containerPort: 8102  
          envFrom:
            - configMapRef:
                name: global-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command: 
        - sh
        - -c
        - |
          until pg_isready -h postgres-db -U postgres; do 
            echo "waiting for database server"; 
            sleep 5; 
          done;
          echo "Checking if vehicle_auth_db exists...";
          until psql -h postgres-db -U postgres -c "SELECT 1 FROM pg_database WHERE datname='vehicle_auth_db'" | grep -q 1; do 
            echo "Database not ready yet"; 
            sleep 2; 
          done;
          echo "vehicle_auth_db is ready!"
        env:
        - name: PGPASSWORD
          value: "super_secret_password"
      containers:
        - name: auth-service
          image: brightdotdev/vta-auth-service:v1
          ports:
            - containerPort: 8103
          envFrom:
            - configMapRef:
                name: global-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

