---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      labels:
        app: logging-service
    spec:
      initContainers:
      - name: wait-for-mongo
        image: mongo:6.0
        command: 
        - sh
        - -c
        - |
          until mongosh --host mongo-logging --eval "db.adminCommand(\"ping\")" --quiet; do 
            echo "waiting for MongoDB"; 
            sleep 5; 
          done;
          echo "MongoDB is ready!"
      containers:
        - name: logging-service
          image: brightdotdev/vta-logging-service:v1
          ports:
            - containerPort: 8104
          envFrom:
            - configMapRef:
                name: global-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"