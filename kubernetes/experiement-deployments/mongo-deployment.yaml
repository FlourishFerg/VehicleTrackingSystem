apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-logging
  labels:
    app: mongo-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-logging
  template:
    metadata:
      labels:
        app: mongo-logging
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-logging
spec:
  selector:
    app: mongo-logging
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
