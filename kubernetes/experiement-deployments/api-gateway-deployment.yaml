apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: flourishtech/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8102
          envFrom:
            - configMapRef:
                name: vehicle-config
            - secretRef:
                name: vehicle-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8102
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8102
            initialDelaySeconds: 30
            periodSeconds: 20
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8102
      targetPort: 8102
  type: ClusterIP
