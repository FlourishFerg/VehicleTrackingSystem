apiVersion: batch/v1
kind: Job
metadata:
  name: init-vehicle-dbs
spec:
  template:
    spec:
      containers:
      - name: init-vehicle-dbs
        image: postgres:15-alpine
        env:
          - name: PGPASSWORD
            value: "super_secret_password"
          - name: PGUSER
            value: "postgres"
        command: ["sh", "-c"]
        args:
          - |
            echo "Waiting for PostgreSQL to be ready..."
            until pg_isready -h postgres-db -U postgres; do
              echo "Waiting for PostgreSQL..."
              sleep 5
            done
            echo "PostgreSQL is ready! Creating databases..."
            # Simple CREATE DATABASE without IF NOT EXISTS
            psql -h postgres-db -U postgres -d postgres -c "CREATE DATABASE VEHICLE_AUTH_DB;"
            psql -h postgres-db -U postgres -d postgres -c "CREATE DATABASE VEHICLE_DISPATCH_DB;"
            psql -h postgres-db -U postgres -d postgres -c "CREATE DATABASE VEHICLE_VEHICLE_DB;"
            echo "Database creation completed!"
      restartPolicy: OnFailure