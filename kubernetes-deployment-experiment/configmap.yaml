apiVersion: v1
kind: ConfigMap
metadata:
  name: global-config
data:
  # Service Ports
  API_GATEWAY_PORT: "8102"
  AUTH_SERVICE_APP_PORT: "8103"
  DISPATCH_SERVICE_APP_PORT: "8105"
  LOGGING_SERVICE_APP_PORT: "8104"
  VEHICLE_SERVICE_APP_PORT: "8106"
  
  # PostgreSQL Configuration
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "super_secret_password"
  POSTGRES_DB_DEFAULT: "postgres"
  POSTGRES_DB_AUTH: "VEHICLE_AUTH_DB"
  POSTGRES_DB_DISPATCH: "VEHICLE_DISPATCH_DB"
  POSTGRES_DB_VEHICLE: "VEHICLE_VEHICLE_DB"
  
