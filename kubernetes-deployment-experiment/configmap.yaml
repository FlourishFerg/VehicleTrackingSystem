  AUTH_SERVICE_SQL_URL: "jdbc:postgresql://postgres-db:5432/VEHICLE_AUTH_DB"
  DISPATCH_SERVICE_SQL_URL: "jdbc:postgresql://postgres-db:5432/VEHICLE_DISPATCH_DB"
